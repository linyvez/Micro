services:
  consul:
    image: hashicorp/consul:latest
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"

  consul-init:
    image: hashicorp/consul:latest
    restart: "no"
    depends_on:
      - consul
    command: >
      sh -c "
        sleep 5 &&
        consul kv put -http-addr=http://consul:8500 hazelcast_config '{\"cluster_name\": \"lab5\", \"cluster_members\": [\"hz-1:5701\", \"hz-2:5701\", \"hz-3:5701\"]}' &&
        consul kv put -http-addr=http://consul:8500 mq_config '{\"queue_name\": \"transaction_queue\"}' &&
        consul kv put -http-addr=http://consul:8500 db_config 'postgresql://user:password@postgres:5432/counter_db' &&
        echo 'Consul initialized successfully...'
      "

  hz-1:
    image: hazelcast/hazelcast:latest
    ports:
      - "5701:5701"
    environment:
      - HZ_CLUSTERNAME=lab5
      - HZ_NETWORK_PUBLICADDRESS=hz-1:5701
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=false
      - HZ_NETWORK_JOIN_TCP_IP_ENABLED=true
      - HZ_NETWORK_JOIN_TCP_IP_MEMBER_LIST=hz-1,hz-2,hz-3

  hz-2:
    image: hazelcast/hazelcast:latest
    ports:
      - "5702:5701"
    environment:
      - HZ_CLUSTERNAME=lab5
      - HZ_NETWORK_PUBLICADDRESS=hz-2:5701
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=false
      - HZ_NETWORK_JOIN_TCP_IP_ENABLED=true
      - HZ_NETWORK_JOIN_TCP_IP_MEMBER_LIST=hz-1,hz-2,hz-3

  hz-3:
    image: hazelcast/hazelcast:latest
    ports:
      - "5703:5701"
    environment:
      - HZ_CLUSTERNAME=lab5
      - HZ_NETWORK_PUBLICADDRESS=hz-3:5701
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=false
      - HZ_NETWORK_JOIN_TCP_IP_ENABLED=true
      - HZ_NETWORK_JOIN_TCP_IP_MEMBER_LIST=hz-1,hz-2,hz-3

  logging-service-1:
    build: .
    command: uvicorn src.services.logging-service.main:app --host 0.0.0.0 --port 8001 --no-access-log
    ports:
      - "8001:8001"
    depends_on:
      consul:
        condition: service_started
      consul-init:
        condition: service_completed_successfully
      hz-1:
        condition: service_started
      hz-2:
        condition: service_started
      hz-3:
        condition: service_started
    environment:
      - PORT=8001
      - CONSUL_URL=http://consul:8500

  logging-service-2:
    build: .
    command: uvicorn src.services.logging-service.main:app --host 0.0.0.0 --port 8001 --no-access-log
    ports:
      - "8002:8001"
    depends_on:
      consul:
        condition: service_started
      consul-init:
        condition: service_completed_successfully
      hz-1:
        condition: service_started
      hz-2:
        condition: service_started
      hz-3:
        condition: service_started
    environment:
      - PORT=8001
      - CONSUL_URL=http://consul:8500

  logging-service-3:
    build: .
    command: uvicorn src.services.logging-service.main:app --host 0.0.0.0 --port 8001 --no-access-log
    ports:
      - "8003:8001"
    depends_on:
      consul:
        condition: service_started
      consul-init:
        condition: service_completed_successfully
      hz-1:
        condition: service_started
      hz-2:
        condition: service_started
      hz-3:
        condition: service_started
    environment:
      - PORT=8001
      - CONSUL_URL=http://consul:8500

  postgres:
    image: postgres:latest
    command: postgres -c max_connections=200
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=counter_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d counter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  counter-service:
    build: .
    command: uvicorn src.services.counter-service.main:app --host 0.0.0.0 --port 8002 --no-access-log
    ports:
      - "8004:8002"
    depends_on:
      consul:
        condition: service_started
      consul-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      hz-1:
        condition: service_started
      hz-2:
        condition: service_started
      hz-3:
        condition: service_started
    environment:
      - PORT=8002
      - CONSUL_URL=http://consul:8500

  facade-service:
    build: .
    command: uvicorn src.services.facade-service.main:app --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - "8000:8000"
    depends_on:
      consul:
        condition: service_started
      consul-init:
        condition: service_completed_successfully
      logging-service-1:
        condition: service_started
      logging-service-2:
        condition: service_started
      logging-service-3:
        condition: service_started
      counter-service:
        condition: service_started
      hz-1:
        condition: service_started
      hz-2:
        condition: service_started
      hz-3:
        condition: service_started
    environment:
      - PORT=8000
      - CONSUL_URL=http://consul:8500
